apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mysql-data
  namespace: store-{{ .Values.storeId }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.mysqlStorageSize | quote }}
{{- if .Values.storageClass }}
  storageClassName: {{ .Values.storageClass | quote }}
{{- end }}
