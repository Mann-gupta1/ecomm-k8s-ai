# Default values for platform (dashboard + orchestrator).
# Override with values-local.yaml or values-prod.yaml.

replicaCount: 1

image:
  repository: urumi/platform
  tag: latest
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

nameOverride: ""
fullnameOverride: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  className: nginx
  host: dashboard.127.0.0.1.nip.io
  annotations: {}

resources:
  requests:
    memory: "64Mi"
    cpu: "50m"
  limits:
    memory: "256Mi"
    cpu: "500m"

# Orchestrator env (store provisioning)
env:
  PORT: "3001"
  STORE_NAMESPACE_PREFIX: "store"
  INGRESS_HOST_TEMPLATE: "store-%s.127.0.0.1.nip.io"
  PROVISIONING_TIMEOUT_MS: "600000"
  MAX_STORES: "20"
  # Set to your built image for WooCommerce auto-install, e.g. "myreg/wordpress-woocommerce:latest"
  WORDPRESS_WOOCOMMERCE_IMAGE: ""

# Security context
securityContext:
  runAsNonRoot: true
  runAsUser: 1000
